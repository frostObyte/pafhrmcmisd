<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 | Radar Lost Contact</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f0c;
      color: #00ff88;
      font-family: 'Consolas', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 0.2em;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 1em;
      color: #ffff;
    }

    .radar-container {
      position: relative;
      width: 250px;
      height: 250px;
      border: 2px solid #00ff88;
      border-radius: 50%;
      margin: 20px auto;
      background: radial-gradient(circle at center, #003300 0%, #000000 80%);
      overflow: hidden;
    }

    .sweep-arm {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-origin: center;
      animation: rotate 2s linear infinite;
    }

    .sweep-arm::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 125px;
      background: rgba(0, 255, 136, 0.3);
      transform: rotate(0deg) translateY(-100%);
      transform-origin: bottom center;
    }

    .blip {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #00ff88;
      border-radius: 50%;
      opacity: 0.8;
      animation: blink 2s infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    a.btn {
      margin-top: 1.5em;
      display: inline-block;
      padding: 12px 24px;
      background-color: #005f33;
      color: #00ff88;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid #00ff88;
      transition: background-color 0.3s ease;
    }

    a.btn:hover {
      background-color: #008855;
    }
  </style>
</head>
<body>

  <div class="radar-container">
    <div class="sweep-arm"></div>
    <!-- Randomly placed blips -->
    <div class="blip" style="top: 30px; left: 80px;"></div>
    <div class="blip" style="top: 150px; left: 170px;"></div>
    <div class="blip" style="top: 90px; left: 190px;"></div>
    <div class="blip" style="top: 200px; left: 40px;"></div>
    <div class="blip" style="top: 110px; left: 120px;"></div>
  </div>

  <h1>404 - Flight Path Lost</h1>
  <h2>The PAFHRMC Recruitment website is still under development.</h2>
   <a class="btn" href="javascript:history.back()">Return to Base</a>

</body>
</html>
